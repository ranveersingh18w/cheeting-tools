<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Command Center</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-panel: #18181b;
            --border: #27272a;
            --accent: #6366f1;
            --text: #e4e4e7;
            --text-muted: #a1a1aa;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: var(--accent);
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #27272a;
            color: white;
        }

        .nav-item.active {
            border-left: 3px solid var(--accent);
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            align-items: center;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Views */
        .view {
            display: none;
            height: 100%;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        /* Tables */
        .table-container {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: #27272a;
        }

        /* Components */
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .bg-success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .bg-warning {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .bg-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .bg-muted {
            background: #3f3f46;
            color: #d4d4d8;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3f3f46;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--success);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 0.8rem;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .btn-outline-danger {
            border: 1px solid var(--danger);
            background: transparent;
            color: var(--danger);
        }

        .btn-outline-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .thumbnail {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .thumbnail:hover {
            transform: scale(3);
            z-index: 100;
            position: relative;
            border-color: var(--accent);
            box-shadow: 0 4px 12px black;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-card {
            background: var(--bg-panel);
            width: 800px;
            max-height: 90vh;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            gap: 20px;
        }

        .image-col {
            flex: 2;
            display: flex;
            justify-content: center;
            background: #000;
            border-radius: 8px;
        }

        .image-col img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        .action-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            padding: 20px;
            background: var(--border);
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 700;
            text-align: left;
        }

        .option-btn:hover {
            background: var(--accent);
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">⚡ MCQ/CMD</div>
        <div class="nav-item active" onclick="switchTab('logs')">📜 Logs Feed</div>
        <div class="nav-item" onclick="switchTab('devices')">📱 Devices</div>
        <div class="nav-item" onclick="switchTab('errors')">⚠️ Errors</div>
    </div>

    <!-- Main -->
    <div class="main">
        <!-- LOGS VIEW -->
        <div id="logs" class="view active">
            <div class="header">
                <div class="page-title">Live Request Logs</div>
                <button class="btn btn-outline-danger btn-sm" onclick="clearLogs()">🗑️ Clear Logs</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Time</th>
                            <th>Req ID</th>
                            <th>Device ID</th>
                            <th>Status</th>
                            <th>Answer</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <!-- Data -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- DEVICES VIEW -->
        <div id="devices" class="view">
            <div class="header">
                <div class="page-title">Device Management</div>
                <button class="btn btn-primary btn-sm" onclick="refreshData()">Refresh</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Device ID</th>
                            <th>Last Seen</th>
                            <th>Auto-Answer</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="devicesTableBody">
                        <!-- Data -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ERRORS VIEW -->
        <div id="errors" class="view">
            <div class="header">
                <div class="page-title">Failed Requests</div>
                <button class="btn btn-primary btn-sm" onclick="refreshData()">Refresh</button>
            </div>
            <div class="table-container">
                <table id="errorsTable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Req ID</th>
                            <th>Device</th>
                            <th>Error Info</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="errorsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Approval Modal -->
    <div id="approvalModal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">Manual Approval</h3>
                <button class="btn btn-danger btn-sm" onclick="closeModal()">Close</button>
            </div>
            <div class="modal-body">
                <div class="image-col">
                    <img id="modalImage" src="" alt="Question">
                </div>
                <div class="action-col">
                    <div style="margin-bottom: 20px;">
                        <span class="badge bg-warning">Pending Review</span>
                        <div style="font-size: 0.8rem; margin-top: 5px; color: var(--text-muted);">Select correct option
                            or trigger AI</div>
                    </div>
                    <button class="option-btn" onclick="approve('A')">Option A</button>
                    <button class="option-btn" onclick="approve('B')">Option B</button>
                    <button class="option-btn" onclick="approve('C')">Option C</button>
                    <button class="option-btn" onclick="approve('D')">Option D</button>
                    <button class="btn btn-primary" style="margin-top: 20px;" onclick="approve(null)">🤖 Auto-Solve with
                        AI</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentRequests = [];
        let currentDevices = [];
        let activeModalRequestId = null;
        let currentDeviceFilter = null;

        document.addEventListener('DOMContentLoaded', () => {
            refreshData();
            setInterval(refreshData, 2000);
        });

        function switchTab(tabId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');

            const navs = document.querySelectorAll('.nav-item');
            if (tabId === 'logs') navs[0].classList.add('active');
            if (tabId === 'devices') navs[1].classList.add('active');
            if (tabId === 'errors') navs[2].classList.add('active');
        }

        function refreshData() {
            // Check if we are filtered. If filtered by device, fetch specific device history.
            // If main feed, fetch main feed.
            // Actually, server has logic: /api/devices/:id/requests for full history.

            const fetchReqs = currentDeviceFilter
                ? fetch(`/api/devices/${currentDeviceFilter}/requests`).then(r => r.json()).then(d => d.requests)
                : fetch('/api/all-requests').then(r => r.json()).then(d => d.requests);

            Promise.all([
                fetchReqs,
                fetch('/api/devices').then(r => r.json())
            ]).then(([reqData, devData]) => {
                currentRequests = reqData || [];
                currentDevices = devData.devices || [];
                renderLogs();
                renderDevices();
                renderErrors();
            });
        }

        function renderLogs() {
            const tbody = document.getElementById('logsTableBody');
            let logs = [...currentRequests].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            // UI Title Update
            const titleEl = document.querySelector('#logs .page-title');
            if (currentDeviceFilter) {
                // logs are already filtered by server if this is set (via refreshData logic change)
                titleEl.innerHTML = `Logs <span style="font-size: 0.8rem; background: var(--border); padding: 4px 8px; border-radius: 4px; margin-left: 10px;">Filter: ${currentDeviceFilter} <button class="btn btn-sm btn-danger" onclick="clearFilter()" style="margin-left: 5px; padding: 2px 6px;">✖</button></span>`;
            } else {
                titleEl.textContent = 'Live Request Logs';
            }

            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 30px; color: var(--text-muted)">No data found</td></tr>';
                return;
            }

            tbody.innerHTML = logs.map(req => {
                let statusBadge = `<span class="badge bg-muted">${req.status}</span>`;
                if (req.status === 'completed') statusBadge = `<span class="badge bg-success">completed</span>`;
                if (req.status === 'pending') statusBadge = `<span class="badge bg-warning">pending</span>`;
                if (req.status === 'error') statusBadge = `<span class="badge bg-danger">error</span>`;
                if (req.status === 'cancelled') statusBadge = `<span class="badge bg-muted" style="opacity:0.5">cancelled</span>`;

                const imgThumb = req.image ? `<img src="${req.image}" class="thumbnail" onclick="event.stopPropagation(); window.open('${req.image}', '_blank')">` : '<span style="color:#666">No img</span>';

                return `
                <tr onclick="if('${req.status}' === 'pending') openModal('${req.id}')" style="cursor: ${req.status === 'pending' ? 'pointer' : 'default'}">
                    <td>${imgThumb}</td>
                    <td>${new Date(req.createdAt).toLocaleTimeString()}</td>
                    <td style="font-family: monospace;">${req.id}</td>
                    <td style="color: var(--accent);">${req.deviceId || 'unknown'}</td>
                    <td>${statusBadge}</td>
                    <td style="font-weight: bold; color: var(--success); font-size: 1.1rem;">${req.answer || '-'}</td>
                </tr>
                `;
            }).join('');
        }

        function renderDevices() {
            const tbody = document.getElementById('devicesTableBody');
            tbody.innerHTML = currentDevices.map(dev => `
                <tr>
                    <td style="font-family: monospace; font-size: 1.1rem;">${dev.id}</td>
                    <td>${new Date(dev.lastSeen).toLocaleTimeString()}</td>
                    <td>
                        <label class="toggle-switch">
                            <input type="checkbox" ${dev.autoAnswer ? 'checked' : ''} onchange="toggleAuto('${dev.id}', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="filterByDevice('${dev.id}')">View Requests</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderErrors() {
            const tbody = document.getElementById('errorsTableBody');
            const errors = currentRequests.filter(r => r.status === 'error' || r.status === 'failed');

            if (errors.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 30px; color: var(--text-muted)">No errors recorded</td></tr>';
                return;
            }

            tbody.innerHTML = errors.map(req => `
                <tr>
                    <td>${new Date(req.createdAt).toLocaleTimeString()}</td>
                    <td>${req.id}</td>
                    <td>${req.deviceId}</td>
                    <td style="color: var(--danger)">Process Failed</td>
                    <td><button class="btn btn-primary btn-sm" onclick="openModal('${req.id}')">Retry / Manual</button></td>
                </tr>
             `).join('');
        }

        function toggleAuto(deviceId, enabled) {
            fetch(`/api/devices/${deviceId}/toggle-auto`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled })
            }).then(() => refreshData());
        }

        function openModal(requestId) {
            activeModalRequestId = requestId;
            document.getElementById('modalTitle').innerText = `Review Request ${requestId}`;

            fetch(`/api/status/${requestId}`).then(r => r.json()).then(data => {
                document.getElementById('modalImage').src = data.image || '';
            });

            document.getElementById('approvalModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('approvalModal').classList.remove('active');
            activeModalRequestId = null;
        }

        function approve(answer) {
            if (!activeModalRequestId) return;

            fetch(`/api/requests/${activeModalRequestId}/approve`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer })
            }).then(() => {
                closeModal();
                refreshData();
            });
        }

        function filterByDevice(devId) {
            currentDeviceFilter = devId;
            switchTab('logs');
            refreshData(); // Triggers server fetch of all items
        }

        function clearFilter() {
            currentDeviceFilter = null;
            refreshData();
        }

        function clearLogs() {
            if (confirm('Clear the main feed? Device history will remain in Devices tab.')) {
                fetch('/api/logs', { method: 'DELETE' }).then(() => refreshData());
            }
        }
    </script>
</body>

</html>
